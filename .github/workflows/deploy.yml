name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - claude/automotive-workshop-interactive-4kt17z
  workflow_dispatch:

# Permissions required for GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NEXT_EXPORT: 'true'
          # Project pages are served from https://<user>.github.io/onux/
          NEXT_PUBLIC_BASE_PATH: '/onux'
        run: npm run build

      # Requires GitHub Pages to be enabled once in repo Settings → Pages
      # (Source: "GitHub Actions"). The workflow token cannot enable it itself.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
